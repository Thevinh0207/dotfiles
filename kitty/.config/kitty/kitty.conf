cursor_blink_interval 0
enable_audio_bell no

# Fonts
font_family JetBrainsMono Nerd Font
font_size 12

background_opacity 0.80

# BEGIN_KITTY_THEME
# Kanagawa
include current-theme.conf
# END_KITTY_THEME

# Zoom in and out keybind
map ctrl+equal change_font_size current +1.0
map ctrl+plus change_font_size current +1.0
map ctrl+minus change_font_size current -1.0
map ctrl+0 change_font_size current 0

# make ctrl + shift + arrow not work
map ctrl+shift+left no_op
map ctrl+shift+right no_op

# send shift and ctrl+shift keys through tmux
map shift+enter send_text all \x1b[13;2u
map ctrl+shift+j send_text all \x1b[106;6u
map ctrl+shift+k send_text all \x1b[107;6u
map ctrl+shift+l send_text all \x1b[108;6u
